# Default exec command when opening file.
# If not set, will default to $EDITOR.
# default: nvim

# Whether to match the behavior of Vim's exit keybindings.
# false -> `ZZ` exits without `cd` to LWD(Last Working Directory) While `ZQ` to LWD
# true  -> vice versa
# If not set, will default to false.
# match_vim_exit_behavior: false

# key (the command you want to use when opening file): [values] (extensions)
# In the key, You can use arguments.
# exec:
#   zathura:
#     [pdf]
#  'feh -.':
#   [jpg, jpeg, png, gif, svg, hdr]

# Whether to do the case-insensitive search by `/`.
# ignore_case: true

# The foreground color of directory, file and symlink.
# Pick one of the following:
#     Black            // 0
#     Red              // 1
#     Green            // 2
#     Yellow           // 3
#     Blue             // 4
#     Magenta          // 5
#     Cyan             // 6
#     White            // 7
#     LightBlack       // 8
#     LightRed         // 9
#     LightGreen       // 10
#     LightYellow      // 11
#     LightBlue        // 12
#     LightMagenta     // 13
#     LightCyan        // 14
#     LightWhite       // 15
#     Rgb(u8, u8, u8)
#     AnsiValue(u8)
# Default to LightCyan(dir), LightWhite(file), LightYellow(symlink) and Red(changed/untracked files in git repositories).
# color:
#   dir_fg: LightCyan
#   file_fg: LightWhite
#   symlink_fg: LightYellow
#   dirty_fg: Red

# Override the built-in keybindings.
# Each entry maps a key chord to an action name. Your bindings are overlaid on
# top of the defaults, so you only need to list what you want to change or add.
#
# Chord syntax:
#   j                 a single key
#   ge / gg / dd      a sequence of keys (chord)
#   C-d / A-j / S-x   Ctrl / Alt / Shift + key
#   Enter Tab Backspace Esc Space Up Down Left Right   named keys
#
# Action names (snake_case):
#   move_down move_up half_page_down half_page_up go_to_top go_to_bottom
#   open open_new_window go_to_parent jump_forward jump_backward
#   unpack delete yank put undo redo
#   toggle_sort toggle_hidden toggle_preview toggle_split toggle_visual reset_selection
#   search_next search_prev scroll_preview_down scroll_preview_up
#   enter_insert enter_insert_dir rename enter_search enter_command_line
#   enter_register zoxide_jump quit quit_without_save
#
# Example (Helix-style `ge` to jump to the bottom of the list):
# keybindings:
#   ge: go_to_bottom
#   'C-d': half_page_down
